[project]
name = "claudebucks"
version = "0.1.0"
description = "Claude Bucks OLED usage monitor"
authors = [
    { name = "Ephram Cola Jacquin", email = "ecolajacquin@gmail.com" },
]
dependencies = [
    "pyserial>=3.5",
]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"

[dependency-groups]
dev = [
    "micropython-rp2-stubs>=1.29.0.post1",
    "mpremote>=1.29.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]

# Mac
collect = "python mac/collector.py"
sender = "python mac/sender.py"
mac = "python mac/main.py"

# Pico
pico-upload = "mpremote fs cp pico/main.py pico/oled.py pico/sprite.py :"
pico-start = "mpremote reset"
pico-stop = 'mpremote exec "print(\"Claude Bucks stopped\")"'
pico-repl = "mpremote repl"
pico-disconnect = "mpremote disconnect"
pico-files = "mpremote fs ls"
pico-clear = "mpremote fs rm -rv :"

# Combined deployment
pico-deploy = { composite = [
    "pico-clear",
    "pico-upload",
    "pico-start"
] }

# Background service
install-agent = "python mac/agent.py install"
uninstall-agent = "python mac/agent.py uninstall"